<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="50%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a38"/>
      <stop offset="50%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#101017"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bgGrad)" rx="24"/>

  <!-- Background Halo -->
  <circle cx="300" cy="400" r="180" fill="url(#accentGlow)" opacity="0.15" filter="url(#glow)"/>

  <!-- Phone Chassis -->
  <rect x="140" y="100" width="320" height="600" rx="44" fill="url(#phoneBody)" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
  
  <!-- Outer Bezel / Screen -->
  <rect x="154" y="114" width="292" height="572" rx="34" fill="url(#screenGrad)" stroke="#222" stroke-width="2"/>

  <!-- Dynamic Island / Punch Hole Notch -->
  <rect x="255" y="130" width="90" height="26" rx="13" fill="#000000" stroke="#333" stroke-width="1.5"/>
  <circle cx="272" cy="143" r="5" fill="#111" stroke="#222" stroke-width="1"/>
  <circle cx="325" cy="143" r="6" fill="#0d1b2a"/>

  <!-- Wallpaper Abstract Art on Screen -->
  <g transform="translate(154, 114)">
    <circle cx="146" cy="286" r="110" fill="#ff1e42" opacity="0.25" filter="url(#glow)"/>
    <circle cx="180" cy="340" r="90" fill="#a3e635" opacity="0.2" filter="url(#glow)"/>
    
    <!-- Time & Date -->
    <text x="146" y="120" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-1">09:41</text>
    <text x="146" y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#a3e635" text-anchor="middle" letter-spacing="1">THE MOBILE LOUNGE</text>
    
    <!-- 5G & Ready Stock Badge -->
    <rect x="56" y="440" width="180" height="34" rx="17" fill="#13131a" stroke="rgba(255,255,255,0.15)"/>
    <text x="146" y="462" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">5G READY STOCK</text>
  </g>

  <!-- Side Buttons -->
  <rect x="135" y="210" width="5" height="42" rx="2.5" fill="#444"/>
  <rect x="135" y="265" width="5" height="42" rx="2.5" fill="#444"/>
  <rect x="460" y="235" width="5" height="60" rx="2.5" fill="#ff1e42"/>

  <!-- Brand Label Overlay on top border -->
  <rect x="180" y="40" width="240" height="36" rx="18" fill="#13131a" stroke="#ff1e42" stroke-width="1.5"/>
  <text x="300" y="63" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">XIAOMI</text>

  <!-- Model Name Bottom Card -->
  <rect x="40" y="720" width="520" height="55" rx="16" fill="#13131a" stroke="rgba(255,255,255,0.1)"/>
  <text x="300" y="745" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">Redmi Note 13 5G</text>
  <text x="300" y="763" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#a3e635" text-anchor="middle">Prism Gold • Kakod Showroom</text>
</svg>